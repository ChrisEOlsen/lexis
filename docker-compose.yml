# Local Postgres dev environment for the experiment/postgres-migration
# branch ONLY -- not part of the main pipeline's architecture (which is
# explicitly zero-external-services, see spec 3.2 and README). Disposable:
# `docker compose down -v` wipes it clean. Not a statement about how the
# shipped app will eventually run Postgres, if it does at all -- that's a
# separate, later decision (see LIMITATIONS.md).

services:
  postgres:
    image: postgres:18
    # work_mem raised well above Postgres's 4MB default -- measured
    # directly (see LIMITATIONS.md) that the default caused large bitmap
    # index scans against postings (a query term with 100K+ matching
    # rows, common at real MS MARCO scale) to go "lossy" and re-check
    # far more heap pages than necessary: 9.28s -> 0.87s (10.7x) for one
    # such term once raised to 256MB. Safe to set server-wide here since
    # this dev instance only ever serves LEXIS's own bounded-concurrency
    # ingestion/query workloads, not arbitrary multi-tenant traffic.
    command: postgres -c work_mem=256MB
    environment:
      POSTGRES_USER: lexis
      POSTGRES_PASSWORD: lexis_dev_only
      POSTGRES_DB: lexis
    ports:
      - "5433:5432"
    volumes:
      - lexis_postgres_data:/var/lib/postgresql
      - ./docker/init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexis -d lexis"]
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  lexis_postgres_data:
